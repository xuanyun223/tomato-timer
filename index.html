<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#e74c3c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="番茄钟" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<title>番茄钟 - 专注时刻</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #fbc2eb 100%);
    overflow: hidden;
    user-select: none;
  }
  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
  }
  .topbar {
    position: absolute;
    top: 20px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .mode-btn {
    background: rgba(255,255,255,0.6);
    border: none;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    transition: all .25s;
    color: #555;
    backdrop-filter: blur(8px);
  }
  .mode-btn.active {
    background: #e74c3c;
    color: #fff;
    box-shadow: 0 4px 12px rgba(231,76,60,.4);
  }
  .timer-wrap {
    position: relative;
    width: 280px;
    height: 280px;
    margin-bottom: 36px;
  }
  svg.progress {
    width: 100%; height: 100%;
    transform: rotate(-90deg);
  }
  .progress circle {
    fill: none;
    stroke-width: 14;
    stroke-linecap: round;
  }
  .bg-circle { stroke: rgba(255,255,255,.5); }
  .fg-circle {
    stroke: #e74c3c;
    stroke-dasharray: 785;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear;
  }
  .time {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .time .num {
    font-size: 64px;
    font-weight: 700;
    color: #2c3e50;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
  }
  .time .label {
    font-size: 14px;
    color: #7f8c8d;
    margin-top: 4px;
  }
  .controls {
    display: flex;
    gap: 16px;
  }
  .btn {
    border: none;
    padding: 14px 36px;
    border-radius: 28px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .15s, box-shadow .2s;
    color: #fff;
  }
  .btn:active { transform: scale(0.96); }
  .btn.start { background: #e74c3c; box-shadow: 0 6px 18px rgba(231,76,60,.4); }
  .btn.pause { background: #f39c12; box-shadow: 0 6px 18px rgba(243,156,18,.4); }
  .btn.reset { background: #95a5a6; box-shadow: 0 6px 18px rgba(149,165,166,.4); }
  .stat {
    margin-top: 28px;
    font-size: 14px;
    color: #555;
    background: rgba(255,255,255,.55);
    padding: 8px 18px;
    border-radius: 16px;
    backdrop-filter: blur(8px);
  }
  .stat b { color: #e74c3c; }

  /* 警告弹窗 */
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    animation: fade .2s;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 20px;
    padding: 32px 28px;
    width: 86%;
    max-width: 340px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    animation: pop .3s cubic-bezier(.34,1.56,.64,1);
  }
  .modal .emoji { font-size: 56px; margin-bottom: 12px; }
  .modal h2 { color: #e74c3c; font-size: 22px; margin-bottom: 10px; }
  .modal p { color: #555; font-size: 15px; line-height: 1.6; margin-bottom: 22px; }
  .modal .ok {
    background: linear-gradient(135deg, #e74c3c, #ff6b6b);
    border: none;
    color: #fff;
    padding: 12px 40px;
    border-radius: 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(231,76,60,.4);
  }
  @keyframes fade { from{opacity:0} to{opacity:1} }
  @keyframes pop { from{transform:scale(.7);opacity:0} to{transform:scale(1);opacity:1} }
  .shake { animation: shake .5s; }
  @keyframes shake {
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-8px)}
    40%{transform:translateX(8px)}
    60%{transform:translateX(-6px)}
    80%{transform:translateX(6px)}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="mode-btn active" data-mode="work">专注 25 分</button>
    <button class="mode-btn" data-mode="break">休息 5 分</button>
  </div>

  <div class="timer-wrap" id="timerWrap">
    <svg class="progress" viewBox="0 0 280 280">
      <circle class="bg-circle" cx="140" cy="140" r="125"></circle>
      <circle class="fg-circle" id="fg" cx="140" cy="140" r="125"></circle>
    </svg>
    <div class="time">
      <div class="num" id="time">25:00</div>
      <div class="label" id="label">专注时间</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn start" id="startBtn">开始专注</button>
    <button class="btn reset" id="resetBtn">重置</button>
  </div>

  <div class="stat">已完成专注 <b id="count">0</b> 次</div>
</div>

<div class="modal-mask" id="modal">
  <div class="modal" id="modalBox">
    <div class="emoji">👀</div>
    <h2>小家伙偷懒，被我抓到了吧！</h2>
    <p>检测到你切出了番茄钟页面，计时已自动暂停。<br/>乖乖回来继续专注吧～</p>
    <button class="ok" id="modalOk">我知道了，继续专注</button>
  </div>
</div>

<script>
(function () {
  const WORK = 25 * 60, BREAK = 5 * 60;
  const C = 2 * Math.PI * 125;

  const $ = id => document.getElementById(id);
  const timeEl = $('time'), labelEl = $('label'), fg = $('fg');
  const startBtn = $('startBtn'), resetBtn = $('resetBtn');
  const modal = $('modal'), modalBox = $('modalBox'), modalOk = $('modalOk');
  const countEl = $('count');
  const timerWrap = $('timerWrap');

  let mode = 'work';
  let total = WORK, remain = WORK;
  let running = false, timer = null;
  let count = parseInt(localStorage.getItem('tomato_count') || '0', 10);
  countEl.textContent = count;

  function fmt(s) {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const ss = (s % 60).toString().padStart(2, '0');
    return m + ':' + ss;
  }
  function render() {
    timeEl.textContent = fmt(remain);
    fg.style.strokeDashoffset = C * (1 - remain / total);
  }
  function setMode(m) {
    mode = m;
    total = m === 'work' ? WORK : BREAK;
    remain = total;
    running = false;
    clearInterval(timer);
    startBtn.textContent = m === 'work' ? '开始专注' : '开始休息';
    startBtn.className = 'btn start';
    labelEl.textContent = m === 'work' ? '专注时间' : '休息时间';
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
    render();
  }

  function tick() {
    if (remain <= 0) {
      clearInterval(timer);
      running = false;
      if (mode === 'work') {
        count++;
        localStorage.setItem('tomato_count', count);
        countEl.textContent = count;
        notify('🎉 专注完成！休息一下吧');
        setMode('break');
      } else {
        notify('☕ 休息结束，继续加油！');
        setMode('work');
      }
      return;
    }
    remain--;
    render();
  }
  function notify(msg) {
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification(msg);
    }
    if (navigator.vibrate) navigator.vibrate(300);
    alert(msg);
  }

  startBtn.addEventListener('click', () => {
    if (!running) {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
      running = true;
      startBtn.textContent = '暂停';
      startBtn.className = 'btn pause';
      timer = setInterval(tick, 1000);
    } else {
      running = false;
      clearInterval(timer);
      startBtn.textContent = '继续';
      startBtn.className = 'btn start';
    }
  });
  resetBtn.addEventListener('click', () => {
    running = false;
    clearInterval(timer);
    remain = total;
    startBtn.textContent = mode === 'work' ? '开始专注' : '开始休息';
    startBtn.className = 'btn start';
    render();
  });
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.addEventListener('click', () => setMode(b.dataset.mode));
  });

  // 切屏检测
  function showWarn() {
    modal.classList.add('show');
    modalBox.classList.add('shake');
    setTimeout(() => modalBox.classList.remove('shake'), 500);
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }
  modalOk.addEventListener('click', () => {
    modal.classList.remove('show');
  });

  document.addEventListener('visibilitychange', () => {
    // 仅在专注运行中检测切屏
    if (running && mode === 'work' && document.visibilityState === 'hidden') {
      running = false;
      clearInterval(timer);
      startBtn.textContent = '继续';
      startBtn.className = 'btn start';
      showWarn();
    }
  });

  // 部分移动端浏览器切屏不会触发 visibilitychange，补充 blur
  window.addEventListener('blur', () => {
    if (running && mode === 'work') {
      running = false;
      clearInterval(timer);
      startBtn.textContent = '继续';
      startBtn.className = 'btn start';
      showWarn();
    }
  });

  render();
})();

// 注册 Service Worker 实现离线访问
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
